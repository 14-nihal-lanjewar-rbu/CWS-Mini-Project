<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ScholarPath - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="row g-0">
        <aside class="col-lg-4 login-side d-flex flex-column">
            <a class="brand text-white" href="index.html">ScholarPath<span>.</span></a>
            <div class="my-auto">
                <h1 class="fw-bold display-5">Never miss a scholarship again</h1>
                <p class="mt-4">⇧ &nbsp; Keep documents organised</p>
                <p>♧ &nbsp; Explore scholarship options</p>
                <p>◷ &nbsp; Track every deadline</p>
            </div>
            <a class="text-white small" href="index.html">← Back to Home</a>
        </aside>

        <main class="col-lg-8 login-content">
            <div class="row g-4 align-items-center justify-content-center h-100">
                <div class="col-md-6">
                    <div class="soft-card p-4">
                        <h3 class="fw-bold">Welcome back</h3>
                        <p class="small-muted">Student login</p>
                        <form action="dashboard.html" method="get">
                            <label class="form-label" for="loginEmail">Email</label>
                            <input class="form-control mb-3" id="loginEmail" type="email" required placeholder="you@email.com">
                            <label class="form-label" for="loginPassword">Password</label>
                            <input class="form-control mb-3" id="loginPassword" type="password" required placeholder="Enter password">
                            <button class="btn btn-main w-100" type="submit">Login</button>
                        </form>
                    
                    </div>
                </div>

                <div class="col-md-6" id="signup">
                    <div class="soft-card p-4" style="border: 2px solid var(--purple);">
                        <h3 class="fw-bold">Create account</h3>
                        <p class="small-muted">Student sign up</p>
                        <form action="profile.html" method="get">
                            <label class="form-label" for="fullName">Full name</label>
                            <input id="fullName" class="form-control mb-2" required placeholder="Your name">
                            <label class="form-label" for="newEmail">Email</label>
                            <input id="newEmail" type="email" class="form-control mb-2" required placeholder="you@email.com">
                            <label class="form-label" for="newPassword">Password</label>
                            <input id="newPassword" type="password" minlength="4" class="form-control mb-2" required placeholder="Create password">
                            <label class="form-label" for="confirmPassword">Confirm password</label>
                            <input id="confirmPassword" type="password" minlength="4" class="form-control mb-3" required placeholder="Repeat password">
                            <button class="btn btn-coral w-100" type="submit">Sign Up</button>
                        </form>
                       
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
